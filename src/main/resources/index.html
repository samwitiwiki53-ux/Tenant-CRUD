<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tenant Management System</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#233347;font:16px/1.5 system-ui,sans-serif}header{background:#1c4e80;color:white;padding:1.5rem max(4vw,1rem)}h1,h2,p{margin:0 0 .6rem}main{max-width:1100px;margin:1.5rem auto;padding:0 1rem}button,input,select{font:inherit;border:1px solid #bcc9d5;border-radius:6px;padding:.45rem .7rem}button{background:white;cursor:pointer}button[aria-current=true],button.primary{background:#194e7d;color:white}nav,form,.bar{display:flex;gap:.6rem;flex-wrap:wrap;align-items:end;margin-bottom:1rem}label{display:grid;font-size:.9rem;font-weight:600}section{padding:1rem;background:white;border-radius:8px;margin-bottom:1rem}.scroll{overflow:auto}table{border-collapse:collapse;width:100%}td,th{padding:.5rem;text-align:left;border-bottom:1px solid #e1e6eb}th{background:#eef3f8}#msg{color:#794015}td button{margin-right:.3rem}</style><script defer src="/app.js"></script></head><body><header><h1>Tenant Management System</h1><p>Kampala rental records · MongoDB class demonstration</p></header><main><nav aria-label="Collections"></nav><p role="status" id="msg"></p><section id="entry"><h2 id="formTitle">Add a demo tenant</h2><p>Use fictional details. You can edit or delete the tenants you add in this browser.</p><form><label>Tenant name<input name="name" required maxlength="100"></label><label>Unit number<input name="unitNumber" required maxlength="100"></label><label>Property name<input name="propertyName" required maxlength="100"></label><label>Monthly rent (UGX)<input name="monthlyRent" type="number" min="0" max="1000000000" required></label><label>Status<select name="status"><option>Active</option><option>Inactive</option></select></label><button class="primary">Save tenant</button><button id="clear" type="button">Clear</button></form></section><section><h2 id="title">Tenants</h2><label>Search records<input id="search" type="search"></label><div class="scroll"><table><thead></thead><tbody></tbody></table></div></section></main></body></html>
